spring:
  application:
    name: taskflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  # Phase 3.0: every /api request must carry a Keycloak access token (see infrastructure/keycloak).
  security:
    oauth2:
      resourceserver:
        jwt:
          # Resolved lazily on the first request, so the backend starts even when Keycloak is not up yet.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/taskflow}
          # Tokens must be issued for this API (Keycloak's audience mapper on the taskflow-web client adds it).
          audiences: ${KEYCLOAK_API_AUDIENCE:taskflow-api}

server:
  port: ${SERVER_PORT:8080}

# LangChain4j Spring Boot starter (langchain4j-open-ai-spring-boot-starter).
# Creates the ChatModel bean that @AiService interfaces (TaskAgent) use automatically.
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:test-key}
      model-name: ${OPENAI_MODEL_NAME:gpt-4o-mini}
      temperature: ${OPENAI_TEMPERATURE:0.2}
      # Logs full request/response bodies (including task content). Development only.
      log-requests: ${OPENAI_LOG_REQUESTS:false}
      log-responses: ${OPENAI_LOG_RESPONSES:false}

taskflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    # Upper bound on LLM -> tool -> LLM round trips per user message.
    max-tool-round-trips: ${AI_MAX_TOOL_ROUND_TRIPS:8}
    # Phase 3.4: conversation memory is stored in PostgreSQL (ai_chat_memory) with a transcript (ai_chat_messages).
    memory:
      # TaskAgent's sliding window: the messages the model sees.
      max-messages: ${AI_MEMORY_MAX_MESSAGES:30}
      # Conversations without activity for this long are deleted with their memory and transcript.
      retention: ${AI_MEMORY_RETENTION:30d}
      # Conversations kept per user; the least recently used are deleted beyond this.
      max-conversations: ${AI_MEMORY_MAX_CONVERSATIONS:100}
      # Upper bound on one stored memory window (characters of JSON); the oldest messages are dropped above it.
      max-stored-bytes: ${AI_MEMORY_MAX_STORED_BYTES:262144}
      # How often the retention job runs (ISO-8601 duration).
      cleanup-interval: ${AI_MEMORY_CLEANUP_INTERVAL:PT1H}
    confirmation:
      ttl: ${AI_CONFIRMATION_TTL:5m}
    # Phase 2: TaskFlowSupervisor + PriorityAgent / PlanningAgent / SummaryAgent (+ TaskAgent as a sub-agent).
    supervisor:
      # Upper bound on sub-agent invocations per user message (each costs at least two LLM calls).
      max-agent-invocations: ${AI_SUPERVISOR_MAX_AGENT_INVOCATIONS:5}
      # Upper bound on tool calls inside one sub-agent invocation.
      max-tool-round-trips: ${AI_SUPERVISOR_MAX_TOOL_ROUND_TRIPS:8}
      # Sliding window of the supervisor's own planning memory per conversation.
      memory-max-messages: ${AI_SUPERVISOR_MEMORY_MAX_MESSAGES:20}
      # LAST = answer of the last agent called (default), SUMMARY = planner's recap, SCORED = extra LLM call picks.
      response-strategy: ${AI_SUPERVISOR_RESPONSE_STRATEGY:LAST}
      # CHAT_MEMORY (default), SUMMARIZATION or CHAT_MEMORY_AND_SUMMARIZATION.
      context-strategy: ${AI_SUPERVISOR_CONTEXT_STRATEGY:CHAT_MEMORY}
    # Phase 3.3: conversation guardrails (input scope and injection, untrusted tool data, write limit, output checks).
    guardrails:
      enabled: ${AI_GUARDRAILS_ENABLED:true}
      # Task changes one assistant message may make; further writes are refused.
      max-writes-per-request: ${AI_GUARDRAILS_MAX_WRITES:10}
      # Reprompts of an agent whose answer failed the output check, before the safe fallback is shown.
      output-retries: ${AI_GUARDRAILS_OUTPUT_RETRIES:1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.taskflow: INFO
    dev.langchain4j: INFO
    dev.langchain4j.agentic: INFO
  pattern:
    # requestId / conversationId are set in the MDC by AgentService for every AI request.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] %-40.40logger{39} %X{requestId:-}%X{conversationId:- } : %m%n"

